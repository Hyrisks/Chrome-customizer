<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <nav class="top">
    <a href="https://mail.google.com/">Gmail</a>
    <a href="https://www.google.com/imghp">Images</a>
  </nav>

  <main>
    <div class="logo">Google</div>
    <form action="https://www.google.com/search" method="get" autocomplete="off">
      <div class="pill">
        <input type="text" name="q" placeholder="Search Google or type a URL" autofocus>
        <button type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#5f6368" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        </button>
      </div>
    </form>
  </main>

  <script src="shared.js"></script>
  <script src="quicklinks.js"></script>
  <script src="host.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
