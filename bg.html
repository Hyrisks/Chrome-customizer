<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Background</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #layer { position: fixed; inset: 0; overflow: hidden; }
    .gq-media { position: absolute; max-width: none; max-height: none; pointer-events: none; user-select: none; }
    #dim { position: absolute; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="layer"><div id="dim"></div></div>
  <script src="shared.js"></script>
  <script src="bg.js"></script>
</body>
</html>
